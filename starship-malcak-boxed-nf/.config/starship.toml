"$schema" = 'https://starship.rs/config-schema.json'

palette = 'malcak'

# os symbols are mainly from nf-linux-*
# hostname, username, directory, time, duration symbols are from nf-oct-*
# git symbols are primarily from nf-cod-*
# programming languages are primarily from nf-md-language-*, nf-dev-*
# other symbols are from nf-dev-*

format = """
$character\
$os\
$username\
$hostname\
$directory\
$time\
$cmd_duration\
([◆ ](black)\
$git_status\
$git_state\
$git_branch\
$git_commit\
$git_metrics\
$kubernetes\
$helm\
$all)\
$line_break\
[ │](fg:black)\
$line_break\
[ ╰─▶ ](fg:black)
"""

command_timeout = 1500
add_newline = true

[palettes.malcak]
black = '#404040'
red = '#e06c75'
green = '#98c379'
yellow = '#e5c07b'
blue = '#61afef'
purple = '#c678dd'
cyan = '#56b6c2'
white = '#fafafa'
orange = '#fe8019'
bright-black = '#2d2d2d'
bright-red = '#e45649'
bright-green = '#50a14f'
bright-yellow = '#c18401'
bright-blue = '#0184bc'
bright-purple = '#a626a4'
bright-cyan = '#0997b3'
bright-white = '#8c8c8c'
bright-orange = '#af3a03'

icon_bg = '#404040'
icon_fg = '#8c8c8c'
text_bg = '#2d2d2d'
text_fg = '#fafafa'

sep = '#363636'

[os]
disabled = true
symbols = { Debian = "", Fedora = "", Macos = "", Raspbian = "", Unknown = "?", Windows = "" }
style = "bg:text_bg fg:text_fg dimmed"
format = '[ $symbol ](bg:icon_bg fg:text_fg bold)[ $name ]($style) '

[hostname]
ssh_only = true
style = "bg:cyan fg:icon_bg"
format = "[ @ ](bg:icon_bg fg:cyan bold)[ $hostname ]($style bold) "

[username]
show_always = true
style_user = "bg:text_bg fg:text_fg dimmed"
format = '[  ](bg:icon_bg fg:text_fg bold)[ $user ]($style) '

[directory]
style = "bg:text_bg fg:text_fg dimmed"
format = "[  ](bg:icon_bg fg:yellow bold)[ $path ]($style) "
truncation_length = 4
truncation_symbol = "…/"

[time]
disabled = false
# https://docs.rs/chrono/0.4.7/chrono/format/strftime/index.html
# time_format = "%F %R" # 2001-07-08 00:34
time_format = "%a %R" # Sun 00:34
style = "bg:text_bg fg:text_fg dimmed"
format = '[  ](bg:icon_bg fg:text_fg bold)[ $time ]($style) '

[cmd_duration]
min_time = 500
show_milliseconds = true
style = "bg:text_bg fg:text_fg dimmed"
format = '[  ](bg:icon_bg fg:text_fg bold)[ $duration ]($style) '

[character]
error_symbol = "[ \\$ ](red bold bg:icon_bg)"
success_symbol = "[ \\$ ](green bold bg:icon_bg)"

[git_branch]
symbol = ""
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:red bold)[ $branch ]($style) '

[git_status]
style = "bg:text_bg fg:text_fg"
format = '[  ](bg:icon_bg fg:red bold)[ $all_status$ahead_behind ]($style) '
conflicted = "[>=<](bg:text_bg fg:purple dimmed)"
ahead = "[>](bg:text_bg fg:blue dimmed)"
behind = "[<](bg:text_bg fg:yellow dimmed)"
diverged = "[<>](bg:text_bg fg:orange dimmed)"
untracked = "[?](bg:text_bg fg:bright-white dimmed)"
stashed = "[$](bg:text_bg fg:bright-blue dimmed)"
modified = "[!](bg:text_bg fg:bright-yellow dimmed)"
staged = "[+](bg:text_bg fg:bright-green dimmed)"
renamed = "[r](bg:text_bg fg:bright-cyan dimmed)"
deleted = "[x](bg:text_bg fg:bright-red dimmed)"

[git_state]
style = "bg:text_bg fg:text_fg"
format = '[  ](bg:icon_bg fg:red bold)[ $state($progress_current/$progress_total) ]($style) '

[terraform]
symbol = "󱁢"
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:purple bold)[( $version )]($style)[(  $workspace )](bg:icon_bg fg:purple bold inverted) '

[python]
symbol = "󰌠"
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:green bold)[( $version )]($style)[( $virtualenv )](bg:icon_bg fg:green bold inverted) '

[rust]
symbol = ""
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:orange bold)[( $version )]($style) '

[lua]
symbol = "󰢱"
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:blue bold)[( $version )]($style) '

[golang]
# symbol from nf-seti-go
symbol = ""
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:blue bold)[( $version )]($style) '

[ruby]
symbol = "󰴭"
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:red bold)[( $version )]($style) '

[java]
symbol = "󰬷"
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:red bold)[( $version )]($style) '

[kubernetes]
disabled = false
detect_files = ['helmfile.yaml', 'Chart.yaml', 'chart.yaml', 'config']
symbol = ""
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:blue bold)[( $context )]($style)[( $namespace )](bg:icon_bg fg:blue bold inverted) '

[helm]
disabled = false
detect_files = ['helmfile.yaml', 'Chart.yaml', 'chart.yaml']
symbol = ""
style = "bg:text_bg fg:text_fg"
format = '[ $symbol ](bg:icon_bg fg:bright-blue bold)[( $version )]($style) '

[package]
disabled = true

[docker_context]
disabled = true

[vagrant]
disabled = true

[nodejs]
disabled = true

[bun]
disabled = true

[deno]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true
